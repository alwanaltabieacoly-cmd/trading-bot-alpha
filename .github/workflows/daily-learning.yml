name: Daily learning

# Turns labelled outcomes into explicit, dated lessons and commits them.
# Runs after Outcome (20:55 UTC) so it always sees the freshest labels, then
# the next Deliberate cycle cites them in the analyst prompt and blackboard.

on:
  schedule:
    - cron: "15 21 * * 1-5"   # 21:15 UTC Mon-Fri
  workflow_dispatch:

concurrency:
  group: daily-learning
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow ccxt yfinance

      - name: Build daily digest
        run: python -m agents.daily_learning --write

      - name: Refresh data and audit quality
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Bounded refresh so the audit measures the same data a session uses.
          python -m agents.universe --refresh --max 24 --days 400 || true
          python scripts/data_quality.py --write

      - name: Build act-on-it brief
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/daily_brief.py --write
          echo "" >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 "research/reports/brief/$(date -u +%Y-%m-%d).md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit lessons and brief
        run: |
          git config user.name "learning-bot"
          git config user.email "learning-bot@users.noreply.github.com"
          git add research/reports/learning 2>/dev/null || echo "skip (nothing to add): learning json"
          git add research/LESSONS_AUTO.md 2>/dev/null || echo "skip (nothing to add): lessons md"
          git add research/reports/brief 2>/dev/null || echo "skip (nothing to add): brief"
          git add research/reports/quality 2>/dev/null || echo "skip (nothing to add): quality"
          bash scripts/ci_commit_push.sh "learning: digest $(date -u +%Y-%m-%d_%H%M)"

      - name: Summary
        run: |
          echo "### Daily learning digest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python -m agents.daily_learning --markdown >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python scripts/data_quality.py >> "$GITHUB_STEP_SUMMARY"
