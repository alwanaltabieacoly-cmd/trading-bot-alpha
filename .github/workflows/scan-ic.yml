name: Scan IC

# Weekly honesty check: does our scan score actually predict forward returns?
# Measures the cross-sectional information coefficient per asset class across
# many historical timestamps, then regenerates the shortlist with the verdict
# (score-based only where the IC is predictive).
#
# Runs on a clean runner with no PC involvement.

on:
  schedule:
    - cron: "0 6 * * 6"   # Saturday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: scan-ic
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy pyarrow yfinance

      - name: Refresh universe data
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agents.universe --refresh --max 24 --days 400 || true

      - name: Measure scan information coefficient
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/scan_ic.py --write

      - name: Regenerate shortlist with IC verdict
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/scan_shortlist.py

      - name: Commit measurement
        run: |
          git config user.name "scan-ic-bot"
          git config user.email "scan-ic-bot@users.noreply.github.com"
          git add research/reports/scan_ic.json research/reports/scan_ic.md 2>/dev/null || echo "skip: scan_ic"
          git add research/reports/scan_shortlist.json 2>/dev/null || echo "skip: shortlist"
          bash scripts/ci_commit_push.sh "scan-ic: measure $(date -u +%Y-%m-%d_%H%M)"

      - name: Summary
        run: |
          echo "### Scan information coefficient" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat research/reports/scan_ic.md >> "$GITHUB_STEP_SUMMARY"
