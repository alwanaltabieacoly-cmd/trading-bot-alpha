name: Sentiment

# Runs the sentiment collector (F&G + GDELT + Reddit) every 6 hours,
# 24/7, even with the PC off.  Writes to sentiment/sentiment.sqlite
# which the Trade Agent warmup reads for its GO/NO-GO verdict.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sentiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run sentiment collector
        run: |
          python -m sentiment.collector

      - name: Commit sentiment data
        run: |
          git config user.name "sentiment-bot"
          git config user.email "sentiment-bot@users.noreply.github.com"
          git add -f sentiment/sentiment.sqlite
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "sentiment: run $(date -u +%Y-%m-%d_%H%M)"
            git push --force
          fi

      - name: Summary
        run: |
          echo "### Sentiment complete" >> $GITHUB_STEP_SUMMARY
          python summary_sentiment.py >> $GITHUB_STEP_SUMMARY
