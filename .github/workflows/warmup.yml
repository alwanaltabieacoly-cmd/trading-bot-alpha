name: Warmup

# Runs the Trade Agent warmup before the US market open (14:45 UTC = 9:45 AM ET).
# Fetches LIVE candles from Kraken before the verdict so the regime signal
# is computed from fresh data, not stale committed cache.
# Also runs at 00:30 UTC so the morning verdict uses fresh data.

on:
  schedule:
    - cron: "30 0 * * *"      # 00:30 UTC
    - cron: "45 14 * * 1-5"   # 14:45 UTC Mon-Fri
  workflow_dispatch:
    inputs:
      all:
        description: "Include AAPL equity"
        type: boolean
        default: true
      pairs:
        description: "Comma-separated base symbols"
        type: string
        default: "BTC,ETH,SOL"

concurrency:
  group: warmup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy pyarrow requests

      - name: Fetch LIVE candles from Kraken
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          PAIRS="${{ inputs.pairs }}"
          python fetch_live.py --pairs $(echo $PAIRS | tr ',' ' ') --tf 1h 4h 1d

      - name: Run warmup
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python run_warmup.py --all

      - name: Scan for most profitable pairs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python asset_scanner.py --top 15 --tf 4h --json \
            > research/reports/asset_scan.json 2> research/reports/asset_scan_diagnostics.txt
          # Surface the skip reasons in the run log as well as the artifact.
          tail -n 25 research/reports/asset_scan_diagnostics.txt
          python summary_scan.py >> "$GITHUB_STEP_SUMMARY"

      - name: Commit warmup report
        run: |
          git config user.name "warmup-bot"
          git config user.email "warmup-bot@users.noreply.github.com"
          # Tolerant adds: under `bash -e` a missing or fully-ignored pathspec
          # aborts the whole job (this is how the 2026-10-23 outcome run died).
          for p in research/reports/warmup research/reports/verdicts research/reports/asset_scan.json research/reports/asset_scan_diagnostics.txt research/data; do
            git add "$p" 2>/dev/null || echo "skip (nothing to add): $p"
          done
          # Never force-push: rebase + retry, so parallel workflows and the PC
          # can never lose each other's commits.
          bash scripts/ci_commit_push.sh "warmup: run $(date -u +%Y-%m-%d_%H%M)"

      - name: Summary
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "### Warmup complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fresh candles fetched from Kraken before verdict.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python summary_warmup.py >> $GITHUB_STEP_SUMMARY