name: Lease check (temporary)
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: gate-daily
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          ALPHA_STATE_DIR: research/gate_state
        run: |
          cd research
          python -c "import gate_lock as L; o = L.acquire('ci-check'); print('acquired', o); L.release(o); print('released')"
