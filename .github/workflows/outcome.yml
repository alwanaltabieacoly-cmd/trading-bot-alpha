name: Outcome

# Closes the feedback loop on GitHub -- no PC needed.
# Runs after the warmup to compare GO/NO-GO verdicts against what actually
# happened, then tunes the scoring weights from outcome history.

on:
  schedule:
    - cron: "55 20 * * 1-5"   # 20:55 UTC Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy pyarrow requests

      - name: Fetch latest candles for outcome comparison
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python fetch_live.py --pairs BTC ETH SOL --tf 1h 4h 1d

      - name: Run outcome tracker
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python run_outcome.py --all

      - name: Tune scoring weights from outcome history
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/tune_weights.py

      - name: Commit outcome log
        run: |
          git config user.name "outcome-bot"
          git config user.email "outcome-bot@users.noreply.github.com"
          mkdir -p research/reports/verdicts
          git add research/reports/warmup/outcome_log.jsonl
          git add research/reports/warmup/
          git add research/reports/verdicts/
          git add -f user_data/feature_weights.json 2>/dev/null || true
          bash scripts/ci_commit_push.sh "outcome: run $(date -u +%Y-%m-%d_%H%M)"

      - name: Summary
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "### Outcome complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python summary_outcome.py >> $GITHUB_STEP_SUMMARY
