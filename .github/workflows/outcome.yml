name: Outcome

# Closes the feedback loop on GitHub -- no PC needed.
#
# Runs after the warmup to compare GO/NO-GO verdicts against what actually
# happened.  Writes to reports/warmup/outcome_log.jsonl.
#
# This is the "was I right?" step.  Accumulates evidence so we can answer
# "does the warmup signal have real edge?" after 90 days.

on:
  schedule:
    - cron: "55 20 * * 1-5"   # 20:55 UTC Mon-Fri -- after US close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy pyarrow requests

      - name: Fetch latest candles for outcome comparison
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python fetch_live.py --pairs BTC ETH SOL --tf 1h 4h 1d

      - name: Run outcome tracker
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python run_outcome.py --all

      - name: Commit outcome log
        run: |
          git config user.name "outcome-bot"
          git config user.email "outcome-bot@users.noreply.github.com"
          git add research/reports/warmup/outcome_log.jsonl
          git add research/reports/warmup/
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "outcome: run $(date -u +%Y-%m-%d_%H%M)"
            git push
          fi

      - name: Summary
        run: |
          echo "### Outcome complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          log = 'research/reports/warmup/outcome_log.jsonl'
          try:
              with open(log) as f:
                  lines = f.readlines()
              if not lines:
                  print('no outcomes yet')
              else:
                  latest = json.loads(lines[-1])
                  outs = latest['outcomes']
                  correct = sum(1 for o in outs if o['result']=='CORRECT')
                  wrong = sum(1 for o in outs if o['result']=='WRONG')
                  missed = sum(1 for o in outs if o['result']=='MISSED')
                  total = len(outs)
                  print(f'**Today**: {correct} correct, {wrong} wrong, {missed} missed ({correct/total*100:.0f}%)')
                  print()
                  for o in outs:
                      chg = o.get('price_change_1h_pct') or o.get('price_change_1d_pct')
                      chg_str = f'{chg:+.3f}%' if chg is not None else 'N/A'
                      print(f'- {o[\"pair\"]}: {o[\"verdict\"]} -> {o[\"result\"]} ({chg_str})')
          except FileNotFoundError:
              print('no outcome log yet')
          " >> $GITHUB_STEP_SUMMARY