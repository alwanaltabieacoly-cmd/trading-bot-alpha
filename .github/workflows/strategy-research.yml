name: Strategy research

# Runs the strategy research harness every 4 hours. This works with the
# PC switched off - GitHub runs it on their runners.
#
# On a PUBLIC repository GitHub Actions minutes are unlimited, so a
# 6x/day cadence costs nothing.
#
# The job only ever READS market data and WRITES reports. It never places
# an order, never touches exchange credentials, and never touches money.
# The paper-trading bot runs separately on an always-on machine.

on:
  schedule:
    # Tick every hour, and let the job itself decide whether a research run
    # is actually due (see --min-interval-hours below).
    #
    # GitHub's scheduler is best-effort: a cron slot can be delayed by an
    # hour or skipped outright. Ticking hourly means a missed run is picked
    # up on the next tick instead of being lost for four hours. The gate
    # keeps the actual research cadence at one run every 4 hours.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Use cached data instead of fetching fresh candles"
        type: boolean
        default: false

concurrency:
  group: strategy-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy pyarrow

      - name: Run research
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          if [ "${{ inputs.skip_fetch }}" = "true" ]; then
            python -m research.run_daily --no-fetch
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python -m research.run_daily --min-interval-hours=3.5
          else
            python -m research.run_daily
          fi
          code=$?
          if [ $code -eq 10 ]; then
            echo "::notice::Research not due yet - skipped without doing work"
            echo "SKIPPED_NOT_DUE=1" >> $GITHUB_ENV
          fi
          exit 0

      - name: Deep analysis across all runs
        if: env.SKIPPED_NOT_DUE != '1'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m research.analyze

      - name: Commit report and state
        if: env.SKIPPED_NOT_DUE != '1'
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add research/reports research/state research/data
          git add research/history.csv research/deep-report.md research/deep-report.json
          git add research/evolution.json research/evolution-log.jsonl
          bash scripts/ci_commit_push.sh "research: run $(date -u +%Y-%m-%d_%H%M)"

      - name: Summary
        run: |
          echo "### Research run complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python scripts/research_summary.py >> $GITHUB_STEP_SUMMARY
