name: Deliberate

# Runs the multi-agent deliberation (analyst + critic + auditor + synthesizer)
# on the champion strategy. Works with the PC switched off - GitHub runs it.
# The job only READS market data / decision inputs and WRITES decision JSON.
# It never places orders and never touches exchange credentials.

on:
  schedule:
    - cron: "30 */4 * * *"   # every 4 hours, offset from research
  workflow_dispatch:
    inputs:
      pairs:
        description: "Comma-separated symbols. Blank = auto shortlist from the multi-asset scan."
        type: string
        default: ""
      asof:
        description: "As-of timestamp (UTC ISO). Leave blank for now."
        type: string
        default: ""

concurrency:
  group: deliberate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deliberate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy pyarrow yfinance

      - name: Refresh multi-asset universe
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Crypto (exchange chain) + equities + FX (Yahoo). Bounded and
          # non-fatal: a data gap must not stop deliberation.
          python -m agents.universe --refresh --max 20 --days 400 || true

      - name: Resolve pairs (explicit or scan shortlist)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          IN="${{ inputs.pairs }}"
          if [ -z "$IN" ]; then
            IN="$(python scripts/scan_shortlist.py --print 2>/dev/null || true)"
          fi
          if [ -z "$IN" ]; then
            IN="BTC/USDT,ETH/USDT,SOL/USDT"
            echo "::notice::no positive shortlist - using default pairs"
          fi
          echo "DELIB_PAIRS=$IN" >> "$GITHUB_ENV"
          echo "pairs=$IN" >> "$GITHUB_STEP_SUMMARY"

      - name: Run deliberation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -z "${{ inputs.asof }}" ]; then
            ASOF="$(date -u +%Y-%m-%dT%H:00:00)"
          else
            ASOF="${{ inputs.asof }}"
          fi
          python -m agents.deliberate \
            --pairs "$DELIB_PAIRS" \
            --asof "$ASOF"

      - name: Commit decisions
        run: |
          git config user.name "deliberation-bot"
          git config user.email "deliberation-bot@users.noreply.github.com"
          # user_data/decisions/ is in .gitignore, so plain `git add` silently
          # skips it - and that is exactly the file the Render webhook reads
          # (webhook_server.py: LATEST_DECISION_PATH). Force-add it.
          git add reports/decisions 2>/dev/null || echo "skip (nothing to add): reports/decisions"
          git add -f user_data/decisions/latest.json 2>/dev/null || true
          # Never force-push: rebase + retry keeps parallel workflow commits.
          bash scripts/ci_commit_push.sh "deliberation: run $(date -u +%Y-%m-%d_%H%M)"

      - name: Summary
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "### Deliberation complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls reports/decisions 2>/dev/null | tail -5 >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Cite the latest Vibe-Trading alpha benchmark (no-op when absent).
          python -m agents.vibe_evidence >> "$GITHUB_STEP_SUMMARY" || true