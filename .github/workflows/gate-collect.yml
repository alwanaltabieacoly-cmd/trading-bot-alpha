name: Gate collect
# Records Gate public data Gate does not keep (order-book imbalance, trade tape, liquidations). Runs with the PC off.
on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:
    inputs:
      minutes: {description: "minutes to record", default: "5"}
concurrency: {group: gate-collect, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python research/gate_collect.py ${{ github.event.inputs.minutes || 55 }}
      - run: python research/gate_collect.py coverage
      - name: Commit data
        run: |
          git config user.name alpha-bot; git config user.email alpha-bot@users.noreply.github.com
          git add research/gate_data
          git diff --cached --quiet || git commit -qm "gate data $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
